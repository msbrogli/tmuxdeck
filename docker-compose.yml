services:
  backend:
    build: ./backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backend-data:/data
      - ./docker/templates:/app/docker/templates:ro
      - ./scripts:/app/scripts:ro
      - /tmp/tmux-${HOST_UID:-1000}:/tmp/tmux-host
      - ${HOME}:${HOME}:ro
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_TMUX_SOCKET=/tmp/tmux-host/default
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${BIND_HOST:-127.0.0.1}:5173:80"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=${BACKEND_URL:-backend:8000}
    restart: unless-stopped

volumes:
  backend-data:
